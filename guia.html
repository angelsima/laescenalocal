<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Guías de la escena · Prueba · La Escena Local</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style id="pagesz">@page{size:A4;margin:0}</style>
<style>
:root{
  --amarillo:#FFD36B; --amarillo-ink:#2B1B3D; --acento:#117266; --acento-ink:#FFFFFF;
  --bg:#FAF5F0; --surface:#FFFFFF; --ink:#2B1B3D; --muted:#5F5568; --faint:#A89FAE; --line:#E8DFDE; --soft:#F3ECE9;
  --display:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#E9E2DE;color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
body.fmt-web{background:var(--bg)}
button,select{font:inherit;color:inherit}
a{color:inherit}
.testbar{background:var(--amarillo);color:var(--amarillo-ink);font-size:13px;text-align:center;padding:6px 12px;font-weight:500}
/* ---- Panel de control (no se imprime) ---- */
.ctrl{max-width:1100px;margin:0 auto;padding:16px 16px 6px;display:grid;gap:12px}
.ctrl h1{margin:0;font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:-.02em}
.ctrl h1 small{font-family:var(--mono);font-weight:400;font-size:12px;color:var(--muted);letter-spacing:0;margin-left:6px}
.ctrl .row{display:flex;flex-wrap:wrap;gap:10px}
.ctrl label{display:grid;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
.ctrl select{min-width:200px;max-width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:15px;color:var(--ink);font-weight:500}
.fmts{display:flex;flex-wrap:wrap;gap:6px}
.fmts button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-family:var(--display);font-weight:600;font-size:14px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.fmts button small{font-family:var(--mono);font-weight:400;font-size:11px;color:var(--muted)}
.fmts button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.fmts button[aria-pressed="true"] small{color:var(--amarillo)}
.fmts .rec{font-family:var(--body);font-size:10.5px;font-weight:600;background:var(--amarillo);color:var(--amarillo-ink);border-radius:999px;padding:1px 7px}
.hint{font-size:13px;color:var(--muted);margin:0}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--ink);background:transparent;border-radius:999px;padding:7px 16px;font-weight:600;font-size:14px;cursor:pointer}
.btn.cta{background:var(--amarillo);border-color:var(--amarillo-ink)}
.btn[hidden]{display:none}
#out{padding:12px 0 40px}
.loading{text-align:center;color:var(--muted);padding:60px 16px}
/* ---- Hojas (A4, A5, Instagram) vistas en pantalla, escaladas para que quepan ---- */
.sheets{display:flex;flex-wrap:wrap;gap:22px;justify-content:center;padding:0 16px}
.scaler{position:relative;flex:none}
.scaler>.sheet{position:absolute;top:0;left:0;transform-origin:0 0}
.sheet{background:#FFFDFB;color:var(--ink);box-shadow:0 10px 30px rgba(43,27,61,.18);overflow:hidden;display:flex;flex-direction:column;position:relative}
.sheet.a4{width:210mm;height:297mm;padding:13mm 13mm 11mm}
.sheet.a5{width:148mm;height:210mm;padding:10mm 10mm 8mm}
.sheet.ig{width:1080px;height:1350px;padding:84px 80px 70px;font-size:30px}
.pg-body{flex:1;min-height:0;overflow:hidden;display:grid;align-content:start}
.pgnum{font-family:var(--mono);font-size:8pt;color:var(--muted);display:flex;justify-content:space-between;padding-top:3mm;border-top:.5pt solid var(--line);margin-top:3mm}
/* Cabecera común */
.kick{font-family:var(--mono);font-size:8pt;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lg svg{display:block;height:100%;width:auto}
/* A4 */
.a4 .hd{display:grid;grid-template-columns:1fr auto;gap:6mm;align-items:end;padding-bottom:5mm;border-bottom:1.5pt solid var(--ink);margin-bottom:5mm}
.a4 .hd .lg{height:20mm}
.a4 h1{font-family:var(--display);font-weight:800;font-size:38pt;line-height:.95;letter-spacing:-.03em;margin:2mm 0 0}
.a4 .sub{font-size:10.5pt;margin-top:2mm}
.a4 .sub b{font-family:var(--display)}
.a4 .pg-body{grid-template-columns:1fr 1fr;column-gap:7mm;row-gap:3.2mm}
.a4.cont .pg-body{padding-top:2mm}
.a4.big .pg-body{row-gap:5mm;column-gap:9mm}
.a4.big.one .pg-body{grid-template-columns:1fr}
.a4.big .ent{grid-template-columns:auto 1fr;gap:4mm}
.a4.big .ent .av{width:15mm;height:15mm;font-size:11pt;border-width:.9pt}
.a4.big .ent .av.sp{border-radius:3.5mm}
.a4.big .ent b{font-size:15pt}
.a4.big .ent .k,.a4.big .ent .tg{font-size:9.5pt}
.a4.big .ent .hdl{font-size:9pt}
.ent .ds{font-size:8.5pt;line-height:1.35;margin:1mm 0 .5mm;max-width:150mm}
.a4.big .ent .ds{font-size:10pt}
.gh{grid-column:1/-1;font-family:var(--display);font-weight:800;font-size:13pt;letter-spacing:-.01em;border-bottom:.8pt solid var(--ink);padding:2.5mm 0 1mm;margin-top:1mm;display:flex;justify-content:space-between;align-items:baseline}
.gh span{font-family:var(--mono);font-weight:400;font-size:8pt;color:var(--muted)}
.sh{grid-column:1/-1;display:flex;align-items:baseline;gap:3mm;background:var(--ink);color:#FAF5F0;border-radius:1.6mm;padding:2.2mm 3.5mm;margin-top:1mm}
.sh b{font-family:var(--display);font-weight:800;font-size:16pt;letter-spacing:-.01em;line-height:1}
.sh span{font-size:8.5pt;opacity:.85}
.sh small{margin-left:auto;font-family:var(--mono);font-size:8pt;opacity:.8}
.ent{break-inside:avoid;display:grid;grid-template-columns:auto 1fr;gap:2.5mm;align-items:start}
.ent .av{width:9mm;height:9mm;border-radius:50%;border:.6pt solid var(--ink);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:7.5pt;overflow:hidden;position:relative;background:var(--soft)}
.ent .av.sp{border-radius:2.2mm}
.ent .av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ent b{font-family:var(--display);font-size:10.5pt;line-height:1.1;display:block}
.ent .k{font-size:7.8pt;color:var(--muted);line-height:1.3}
.ent .tg{font-size:7.8pt;line-height:1.3}
.ent .hdl{font-family:var(--mono);font-size:7.5pt;color:var(--acento)}
.ft{display:grid;grid-template-columns:auto 1fr auto;gap:5mm;align-items:center;border-top:1.5pt solid var(--ink);padding-top:4mm;margin-top:4mm}
.qr{width:22mm;height:22mm;display:grid;place-items:center;background:#fff}
.qr svg{width:100%;height:100%;display:block}
.qr .noqr{font-family:var(--mono);font-size:6pt;text-align:center;color:var(--muted);border:.6pt dashed var(--faint);width:100%;height:100%;display:grid;place-items:center;padding:1mm}
.ft p{margin:0;font-size:9pt;line-height:1.35}
.ft p b{font-family:var(--display);font-size:12pt}
.ft .date{font-family:var(--mono);font-size:7.5pt;color:var(--muted);text-align:right}
.evs{grid-column:1/-1;background:var(--soft);border-radius:2mm;padding:2.5mm 3.5mm;display:grid;gap:1mm;font-size:8.5pt}
.evs .t{font-family:var(--display);font-weight:800;font-size:10.5pt}
.evs .e b{font-family:var(--mono);font-weight:500;font-size:7.8pt;margin-right:1.5mm}
.evs .x{font-size:7pt;color:var(--muted)}
/* Flyer A5 */
.sheet.flyer{background:var(--ink);color:#FAF5F0;padding:0}
.flyer .top{background:var(--amarillo);color:var(--amarillo-ink);padding:9mm 9mm 7mm;clip-path:polygon(0 0,100% 0,100% 86%,0 100%)}
.flyer .top .lg{height:12mm;margin-bottom:5mm}
.flyer .top .kick{color:var(--amarillo-ink)}
.flyer h1{font-family:var(--display);font-weight:800;font-size:34pt;line-height:.92;letter-spacing:-.03em;margin:1.5mm 0 2mm}
.flyer .sub{font-size:10pt;font-weight:600;padding-bottom:5mm}
.flyer .pg-body{padding:3mm 9mm 0;row-gap:2.6mm}
.flyer .li{display:grid;grid-template-columns:1fr auto;gap:3mm;align-items:baseline;border-bottom:.5pt dashed rgba(250,245,240,.3);padding-bottom:1.8mm}
.flyer .li b{font-family:var(--display);font-size:11.5pt}
.flyer .li span{font-size:8pt;opacity:.75;display:block}
.flyer .li i{font-style:normal;font-family:var(--mono);font-size:7.5pt;color:var(--amarillo)}
.flyer .sh{background:var(--amarillo);color:var(--amarillo-ink);padding:1.4mm 3mm;margin-top:1.5mm}
.flyer .sh b{font-size:12.5pt}
.flyer .sh span{font-size:7.5pt}
.flyer .more{font-family:var(--display);font-weight:600;font-size:11pt;color:var(--amarillo)}
.flyer .ft{border-top:0;margin:0;padding:4mm 9mm 8mm;grid-template-columns:auto 1fr}
.flyer .qr{width:24mm;height:24mm;padding:1.5mm;border-radius:2mm}
.flyer .ft p b{color:var(--amarillo)}
/* Instagram 1080×1350 */
.ig .kick{font-size:22px}
.ig.cover{background:var(--amarillo);color:var(--amarillo-ink);justify-content:space-between}
.ig.cover .lg{height:170px}
.ig.cover h1{font-family:var(--display);font-weight:800;font-size:150px;line-height:.9;letter-spacing:-.04em;margin:18px 0 26px}
.ig.cover .sub{font-size:40px;font-weight:600}
.ig.cover .swipe{font-family:var(--display);font-weight:800;font-size:38px;display:flex;justify-content:space-between;align-items:center}
.ig .hdi{display:flex;justify-content:space-between;align-items:baseline;border-bottom:4px solid var(--ink);padding-bottom:18px;margin-bottom:34px}
.ig .hdi b{font-family:var(--display);font-weight:800;font-size:46px;letter-spacing:-.02em}
.ig .pg-body{row-gap:28px}
.ig .gh{font-size:34px;border-bottom-width:2px;padding:10px 0 6px}
.ig .gh span{font-size:20px}
.ig .sh{padding:18px 28px;border-radius:16px;gap:20px}
.ig .sh b{font-size:56px}
.ig .sh span{font-size:26px}
.ig .sh small{font-size:22px}
.ig .ent{grid-template-columns:130px 1fr;gap:30px;align-items:center}
.ig .ent .av{width:130px;height:130px;font-size:42px;border-width:3px}
.ig .ent .av.sp{border-radius:30px}
.ig .ent b{font-size:46px}
.ig .ent .k{font-size:26px}
.ig .ent .tg{font-size:26px}
.ig .ent .hdl{font-size:26px}
.ig .pgnum{font-size:20px;padding-top:18px;margin-top:18px;border-top-width:2px}
.ig.end{background:var(--ink);color:#FAF5F0;justify-content:center;gap:40px}
.ig.end h2{font-family:var(--display);font-weight:800;font-size:96px;line-height:.95;letter-spacing:-.03em;margin:0}
.ig.end p{font-size:38px;margin:0;opacity:.9}
.ig.end .url{font-family:var(--display);font-weight:800;font-size:60px;color:var(--amarillo)}
/* Fanzine A5 */
.zine.cover{background:var(--ink);color:#FAF5F0;justify-content:space-between}
.zine.cover .band{background:var(--amarillo);color:var(--amarillo-ink);margin:0 -10mm;padding:7mm 10mm 9mm;clip-path:polygon(0 8%,100% 0,100% 92%,0 100%)}
.zine.cover h1{font-family:var(--display);font-weight:800;font-size:36pt;line-height:.92;letter-spacing:-.03em;margin:0}
.zine.cover .lg{height:16mm}
.zine.cover .lg svg path{fill:#FAF5F0!important;stroke:#FAF5F0!important}
.zine.cover .meta{font-family:var(--mono);font-size:8pt;opacity:.8;display:flex;justify-content:space-between}
.zine .ih{font-family:var(--display);font-weight:800;font-size:18pt;letter-spacing:-.02em;margin:0 0 4mm}
.zine .idx{display:grid;gap:1.6mm;font-size:10pt}
.zine .idx div{display:grid;grid-template-columns:1fr auto;border-bottom:.5pt dotted var(--faint);padding-bottom:1mm}
.zine .idx .is{border-bottom:1pt solid var(--ink);font-family:var(--display);font-weight:800;font-size:12pt;margin-top:2mm}
.zine .idx .is .n small{font-family:var(--body);font-weight:400;font-size:8.5pt;color:var(--muted);margin-left:1.5mm}
.zine .idx .p{font-family:var(--mono);font-size:8.5pt}
.zine .idx em{font-style:normal;color:var(--muted);font-size:8.5pt}
.zine .howto{margin-top:6mm;font-size:9pt;color:var(--muted)}
.zine .pg-body{row-gap:2.8mm}
.zine .lines{flex:1;background:repeating-linear-gradient(to bottom,transparent 0,transparent 8.5mm,var(--line) 8.5mm,var(--line) 8.8mm)}
.zine.back{background:var(--amarillo);color:var(--amarillo-ink);justify-content:center;gap:6mm;text-align:center;align-items:center}
.zine.back h2{font-family:var(--display);font-weight:800;font-size:24pt;line-height:.95;margin:0}
.zine.back p{margin:0;font-size:10pt}
.zine.back .qr{width:34mm;height:34mm;padding:2mm;border-radius:2mm}
/* Web */
.web{max-width:820px;margin:0 auto;padding:8px 16px 40px}
.web .whd{display:grid;gap:8px;padding:18px 0 22px;border-bottom:2px solid var(--ink);margin-bottom:18px}
.web .whd .lg{height:64px}
.web h1{font-family:var(--display);font-weight:800;font-size:clamp(40px,9vw,72px);line-height:.92;letter-spacing:-.035em;margin:4px 0 0}
.web .whd p{margin:0;font-size:16px}
.web .wg{margin:26px 0 10px;font-family:var(--display);font-weight:800;font-size:22px;display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:6px}
.web .wg span{font-family:var(--mono);font-weight:400;font-size:12px;color:var(--muted)}
.web .wsh+.wcards{margin-top:12px}
.web .wsh{margin:40px 0 0;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 16px}
.web .wsh b{font-family:var(--display);font-weight:800;font-size:30px;line-height:1}
.web .wsh span{font-size:14px;opacity:.85}
.web .wsh small{margin-left:auto;font-family:var(--mono);font-size:12px;opacity:.8}
.wcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.wc{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start}
.wc .av{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:14px;overflow:hidden;position:relative;background:var(--soft)}
.wc .av.sp{border-radius:12px}
.wc .av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.wc h3{margin:0;font-family:var(--display);font-size:17px;line-height:1.15}
.wc .k{font-size:12.5px;color:var(--muted)}
.wc .d{font-size:13.5px;margin:4px 0 0}
.wc .tg{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.wc .tg span{font-size:11.5px;border:1px solid var(--line);border-radius:999px;padding:0 8px;background:var(--bg)}
.wc a.igb{display:inline-block;margin-top:8px;font-family:var(--mono);font-size:12.5px;color:var(--acento);text-decoration:none}
.wevs{background:var(--soft);border-radius:14px;padding:12px 16px;margin:18px 0;display:grid;gap:4px;font-size:14px}
.wevs .t{font-family:var(--display);font-weight:800;font-size:18px}
.wevs b{font-family:var(--mono);font-weight:500;font-size:12.5px;margin-right:6px}
.wevs .x{font-size:12px;color:var(--muted)}
.wend{margin-top:30px;background:var(--ink);color:var(--bg);border-radius:18px;padding:20px;display:grid;gap:10px}
.wend h2{margin:0;font-family:var(--display);font-weight:800;font-size:26px}
.wend p{margin:0}
.wend a{display:inline-block;background:var(--amarillo);color:var(--amarillo-ink);border-radius:999px;padding:9px 18px;font-weight:700;text-decoration:none;justify-self:start}
@media print{
  html,body{background:#fff!important}
  .noprint,.testbar{display:none!important}
  #out{padding:0}
  .sheets{display:block;padding:0}
  .scaler{width:auto!important;height:auto!important;break-after:page;page-break-after:always}
  .scaler>.sheet{position:static;transform:none!important;box-shadow:none}
  .scaler:last-child{break-after:auto;page-break-after:auto}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>

async function api(path){ const ctrl=new AbortController(), t=setTimeout(()=>ctrl.abort(),9000);
  try{ const r=await fetch(CFG.url+'/rest/v1/'+path,{signal:ctrl.signal,headers:{apikey:CFG.key}}); const x=await r.text(); if(!r.ok) throw new Error(x||r.status); return x?JSON.parse(x):null; } finally{ clearTimeout(t); } }
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim();
const STOPI=['la','el','los','las','de','del','y','en','the','a'];
function initials(n){ const w=String(n).split(/\s+/).filter(x=>x&&!STOPI.includes(x.toLowerCase())); const a=w.length?w:[String(n)]; return ((a[0][0]||'')+((a[1]||'')[0]||'')).toUpperCase(); }
const imgUrl=v=>!v?'':/^(https?:|blob:|data:)/.test(v)?v:CFG.url+'/storage/v1/object/public/logos/'+encodeURI(v);
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'], DIA3=['dom','lun','mar','mié','jue','vie','sáb'];
const pad=n=>String(n).padStart(2,'0'), isoD=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()), HOY=isoD(new Date());
const addD=(s,n)=>{ const d=new Date(s+'T12:00:00'); d.setDate(d.getDate()+n); return isoD(d); }, dow=s=>new Date(s+'T12:00:00').getDay();
const hoyTxt=()=>{ const d=new Date(); return d.getDate()+' de '+MESES[d.getMonth()]+' de '+d.getFullYear(); };
const KIND={persona:'Proyecto',colectivo:'Colectivo',escuela:'Escuela',espacio:'Espacio'};
const VERB={clases:'Clases',comunidad:'Quedadas y jams',eventos:'Shows',venta:'Venta',espacio:'Sala'};
const G={cities:[],disc:{},discById:{},fams:[],items:[],city:'Murcia',d:'',fmt:''};

// ---------- Datos ----------
async function boot(){
  try{
    const [cs,ds,cnt]=await Promise.all([api('ciudades?select=id,nombre,estado&order=nombre').catch(()=>api('ciudades?select=id,nombre&order=nombre')),api('disciplinas?select=id,nombre,familia,padre_id&order=orden'),api('conteo_fichas?select=ciudad_id,fichas')]);
    const n={}; cnt.forEach(r=>n[r.ciudad_id]=+r.fichas);
    G.cities=cs.map(c=>({id:c.id,nombre:c.nombre,n:n[c.id]||0})).filter(c=>c.n>0);
    ds.forEach(d=>{ G.disc[d.nombre]={id:d.id,fam:d.familia,pid:d.padre_id}; G.discById[d.id]=d.nombre; if(d.familia&&!G.fams.includes(d.familia)) G.fams.push(d.familia); });
    Object.values(G.disc).forEach(d=>d.padre=d.pid?G.discById[d.pid]:null);
  }catch(e){ $('#out').innerHTML='<p class="loading">No se ha podido conectar con la base de datos. Prueba a recargar.</p>'; return; }
  const u=new URL(location.href); G.city=u.searchParams.get('c')||'Murcia'; G.d=u.searchParams.get('d')||''; G.fmt=u.searchParams.get('f')||'';
  if(!G.cities.some(c=>c.nombre===G.city)) G.city=(G.cities[0]||{}).nombre||'Murcia';
  $('#gCity').innerHTML=G.cities.map(c=>`<option${c.nombre===G.city?' selected':''}>${esc(c.nombre)}</option>`).join('');
  await loadCity(); await (document.fonts?document.fonts.ready:Promise.resolve()); draw();
}
async function loadCity(){ const c=G.cities.find(x=>x.nombre===G.city); G.items=[]; if(!c) return;
  const q='fichas?select=id,nombre,formato,puertas,municipio,barrio,descripcion,instagram,imagen,{X}ficha_disciplina(disciplina_id,orden)&{W}&aprobada=eq.true&order=nombre';
  let rows=null; for(const [x,w] of [['familias,publico,',`or=(ciudad_id.eq.${c.id},otras_ciudades.cs.{${c.id}})`],['familias,',`ciudad_id=eq.${c.id}`],['',`ciudad_id=eq.${c.id}`]]){ try{ rows=await api(q.replace('{X}',x).replace('{W}',w)); break; }catch(e){ if(!x) throw e; } }
  G.items=rows.map(f=>({id:f.id,n:f.nombre,fmt:f.formato,doors:f.puertas||[],b:f.barrio||f.municipio||'',t:f.descripcion||'',ig:f.instagram||'',img:f.imagen||'',fam:f.familias||[],
    d:(f.ficha_disciplina||[]).slice().sort((a,b)=>(a.orden||0)-(b.orden||0)).map(x=>G.discById[x.disciplina_id]).filter(Boolean)}));
}
const famOf=d=>(G.disc[d]||{}).fam||'', parOf=d=>(G.disc[d]||{}).padre||null, catOf=d=>parOf(d)||d;
const famsOf=e=>[...new Set([...e.d.map(famOf),...e.fam].filter(Boolean))];
const isFam=d=>G.fams.includes(d);
function inSel(e,d){ if(!d) return true; if(isFam(d)) return famsOf(e).includes(d); return e.d.some(x=>x===d||parOf(x)===d); }
function selItems(){ return G.items.filter(e=>inSel(e,G.d)); }
// Opciones de «¿De qué?»: disciplinas, sus categorías y subcategorías con al menos 2 fichas
function fillD(){ const all=G.items, cnt=d=>all.filter(e=>inSel(e,d)).length, opts=[[ '', 'Toda la escena', all.length ]];
  G.fams.forEach(f=>{ const n=cnt(f); if(!n) return; opts.push([f,f,n]);
    Object.keys(G.disc).filter(x=>famOf(x)===f&&!parOf(x)).forEach(c=>{ const m=cnt(c); if(m<2) return; opts.push([c,'   '+c,m]);
      Object.keys(G.disc).filter(x=>parOf(x)===c).forEach(s=>{ const k=cnt(s); if(k>=2&&k<m) opts.push([s,'      '+s,k]); }); }); });
  if(G.d&&!opts.some(o=>o[0]===G.d)) G.d='';
  $('#gD').innerHTML=opts.map(([v,l,n])=>`<option value="${esc(v)}"${v===G.d?' selected':''}>${esc(l)} (${n})</option>`).join(''); }
// ¿Quién? y ¿Dónde?: proyectos (incluye escuelas y colectivos) y espacios, por separado
const isSp=e=>e.fmt==='espacio';
const SECS=[['quien','¿Quién?','Proyectos, grupos y escuelas',e=>!isSp(e)],['donde','¿Dónde?','Espacios y locales',isSp]];
const sections=list=>SECS.map(([k,t,s,f])=>({k,t,s,l:list.filter(f)})).filter(x=>x.l.length);
const secHead=(s,brk)=>`<div class="sh${brk?' brk':''}" data-k="${s.k}"><b>${s.t}</b><span>${s.s}</span><small>${s.l.length}</small></div>`;
// Agrupar por afinidad, no por la primera etiqueta: cada ficha va al grupo con el que comparte más etiquetas.
// Nivel: toda la escena → por familia; una familia → por categoría; una categoría → por subcategoría.
function candKeys(e){ const d=G.d;
  if(!d) return famsOf(e).sort((a,b)=>G.fams.indexOf(a)-G.fams.indexOf(b));
  if(isFam(d)) return [...new Set(e.d.filter(z=>famOf(z)===d).map(catOf))];
  return [...new Set(e.d.filter(z=>parOf(z)===d))]; }
const tagSet=e=>new Set([...e.d,...e.d.map(parOf).filter(Boolean),...e.fam]);
function simT(a,b){ let i=0; a.forEach(x=>{ if(b.has(x)) i++; }); const u=a.size+b.size-i; return u?i/u:0; }
const byName=(a,b)=>a.n.localeCompare(b.n,'es');
function groups(list){ const d=G.d, GEN='\u0000';
  if(list.length<=6) return [['',list.slice().sort(byName)]];
  const T=new Map(list.map(e=>[e.id,tagSet(e)])), C=new Map(list.map(e=>[e.id,candKeys(e)])), S=(a,b)=>simT(T.get(a.id),T.get(b.id));
  const pick=(e,inK)=>{ const c=C.get(e.id); let best=c[0], bs=-1; c.forEach((k,i)=>{ const s=list.reduce((t,o)=>o!==e&&inK(o,k)?t+S(e,o):t,0)-i*1e-6; if(s>bs){ bs=s; best=k; } }); return best; };
  // 1) Primera vuelta: con quién comparte más etiquetas, mirando a todos los que tienen cada una
  const A=new Map(); list.forEach(e=>A.set(e.id,C.get(e.id).length?pick(e,(o,k)=>C.get(o.id).includes(k)):GEN));
  // 2) Ajuste: cada ficha se queda en el grupo cuyos miembros se le parecen más (hasta que nadie cambia)
  for(let it=0;it<5;it++){ let ch=0; list.forEach(e=>{ if(C.get(e.id).length<2) return; const k=pick(e,(o,k)=>A.get(o.id)===k); if(k!==A.get(e.id)){ A.set(e.id,k); ch++; } }); if(!ch) break; }
  const m=new Map(); list.forEach(e=>{ const k=A.get(e.id); if(!m.has(k)) m.set(k,[]); m.get(k).push(e); });
  // Grupos de una sola ficha: van a «Más …» con las que no tienen etiqueta más concreta
  const gen=[...(m.get(GEN)||[])]; m.delete(GEN); [...m].forEach(([k,l])=>{ if(l.length<2){ gen.push(...l); m.delete(k); } });
  const coh=(e,l)=>l.reduce((t,o)=>o!==e?t+S(e,o):t,0);
  const ord=d?((a,b)=>b[1].length-a[1].length||a[0].localeCompare(b[0],'es')):((a,b)=>G.fams.indexOf(a[0])-G.fams.indexOf(b[0]));
  const out=[...m.entries()].sort(ord).map(([k,l])=>[k,l.slice().sort((a,b)=>coh(b,l)-coh(a,l)||byName(a,b))]);
  if(gen.length) out.push([out.length?(d?'Más '+d.toLowerCase():'Y más'):'',gen.sort(byName)]);
  return out.length===1?[['',out[0][1]]]:out; }

function tagsOf(e){ const d=G.d; let t=e.d.filter(x=>inSel({d:[x],fam:[]},d||x)); if(!d) t=t.filter(x=>!parOf(x)||!t.includes(parOf(x)));

const avatar=(e,cls)=>`<span class="av${e.fmt==='espacio'?' sp':''}${cls?' '+cls:''}">${esc(initials(e.n))}${e.img?`<img src="${esc(imgUrl(e.img))}" alt="" crossorigin="anonymous" onerror="this.remove()">`:''}</span>`;

  catch(e){ alert('No se han podido generar las imágenes. Haz capturas de cada página mientras tanto.'); }
  b.disabled=false; b.textContent='Descargar las imágenes'; });
$('#gPrint').addEventListener('click',()=>window.print());
$('#gCopy').addEventListener('click',async()=>{ try{ await navigator.clipboard.writeText(location.href); $('#gCopy').textContent='Enlace copiado'; setTimeout(()=>$('#gCopy').textContent='Copiar el enlace de esta guía',1800); }catch(e){} });
$('#gFmts').addEventListener('click',e=>{ const b=e.target.closest('[data-fmt]'); if(b){ G.fmt=b.dataset.fmt; draw(); } });
$('#gD').addEventListener('change',()=>{ G.d=$('#gD').value; G.fmt=''; draw(); });
$('#gCity').addEventListener('change',async()=>{ G.city=$('#gCity').value; G.d=''; G.fmt=''; $('#out').innerHTML='<p class="loading">Cargando…</p>'; await loadCity(); draw(); });
boot();
</script>
</body>
</html>
